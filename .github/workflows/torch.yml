name: Torch local policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          components: clippy
      - run: cargo test -p torch_features --features local_only,test-util
      - run: cargo clippy -p torch_features --features local_only,test-util --all-targets -- -D warnings
