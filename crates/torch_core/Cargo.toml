[package]
name = "torch_core"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
local_only = ["torch_features/local_only"]
integration_tests = []
local_fs = []
release_bundle = []
# Enabled when building the self-contained standalone CLI binary (see the bundle
# script). Keep in sync with the `app` crate's `standalone` feature.
standalone = []
test-util = ["dep:mockito", "torch_features/test-util"]

[dependencies]
anyhow.workspace = true
cfg-if.workspace = true
command-corrections.workspace = true
dashmap.workspace = true
dirs.workspace = true
directories.workspace = true
shellexpand.workspace = true
enum-iterator.workspace = true
futures-lite.workspace = true
torch_errors.workspace = true
torch_features.workspace = true
itertools.workspace = true
getset.workspace = true
http.workspace = true
lazy_static.workspace = true
log.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
reqwest.workspace = true
serde.workspace = true
settings.workspace = true
serde_json.workspace = true
serde_with.workspace = true
strum.workspace = true
strum_macros.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true
concat-idents.workspace = true
url.workspace = true
regex.workspace = true
websocket.workspace = true
instant.workspace = true
schemars = "1"
settings_value = { workspace = true, features = ["derive"] }
torch_util.workspace = true
async-broadcast.workspace = true
futures.workspace = true
line-ending.workspace = true
torchui_core.workspace = true
torchui_extras = { workspace = true, features = ["default"] }
mockito = { workspace = true, optional = true }
string-offset.workspace = true
inventory = "0.3.20"
chrono.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = [
    "NSString",
    "NSURL",
    "NSFileManager",
    "NSBundle",
] }
tempfile.workspace = true

[dev-dependencies]
rand.workspace = true
serde_yaml.workspace = true

[build-dependencies]
anyhow.workspace = true
