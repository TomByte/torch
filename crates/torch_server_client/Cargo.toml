[package]
name = "torch_server_client"
version = "0.1.0"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[features]
agent_mode_evals = ["dep:rand"]
test-util = ["dep:mockall"]
integration_tests = ["torch_server_auth/integration_tests"]
skip_login = ["torch_server_auth/skip_login"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-trait.workspace = true
base64.workspace = true
bincode.workspace = true
blocking.workspace = true
bounded-vec-deque.workspace = true
bytes.workspace = true
cfg-if.workspace = true
chrono.workspace = true
command.workspace = true
cynic.workspace = true
derivative.workspace = true
firebase.workspace = true
futures.workspace = true
http.workspace = true
http_client.workspace = true
instant.workspace = true
itertools.workspace = true
lasso.workspace = true
log.workspace = true
mockall = { workspace = true, optional = true }
oauth2.workspace = true
parking_lot.workspace = true
pathfinder_geometry.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
rand = { workspace = true, optional = true }
schemars = { version = "1", features = ["uuid1"] }
serde.workspace = true
serde_json.workspace = true
settings_value.workspace = true
session-sharing-protocol.workspace = true
thiserror.workspace = true
url.workspace = true
uuid.workspace = true
torch_core.workspace = true
torch_errors.workspace = true
torch_graphql.workspace = true
torch_isolation_platform.workspace = true
torch_server_auth.workspace = true
torchui_core.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
diesel = { workspace = true, features = ["sqlite", "chrono"] }
tempfile.workspace = true
websocket.workspace = true

[dev-dependencies]
mockall.workspace = true
mockito.workspace = true
torch_core = { workspace = true, features = ["test-util"] }
torch_server_auth = { workspace = true, features = ["test-util"] }
