# cargo-about configuration for generating third-party license attribution.
#
# The accepted license list must stay in sync with deny.toml's [licenses.allow].
# CI enforces this via script/check_license_config_sync.

accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

# Exclude private workspace crates (publish = false).
private = { ignore = true }

# Build and dev dependencies are not redistributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Built-in workarounds for crates with complicated license packaging.
workarounds = [
    "ring",
    "rustls",
]

# Warp's git-sourced crates (command-corrections, warp-command-signatures,
# warp-completion-metadata, warp-workflows, warp-workflows-types) are marked
# `publish = false`, so the `private` setting above makes cargo-about skip them.
# Their license texts are appended by script/prepare_bundled_resources instead
# (see script/bundled_licenses/).
